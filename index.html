<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>عالم الفلافل - النسخة الواقعية</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f172a;--fg:#1d1d1f;--pn:rgba(255,255,255,.92);--ac:#e8730c;--ac2:#16a34a;--bd:rgba(0,0,0,.12);
  --sh:0 8px 32px rgba(0,0,0,.18);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--fg:#f2f2f7;--pn:rgba(24,24,28,.9);--bd:rgba(255,255,255,.14)}
}
:root[data-theme="dark"]{--fg:#f2f2f7;--pn:rgba(24,24,28,.9);--bd:rgba(255,255,255,.14)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:Tajawal,Tahoma,sans-serif;overflow:hidden;touch-action:none}
canvas#c3d{display:block;position:fixed;inset:0;width:100%;height:100%}

.pn{
  position:fixed;background:var(--pn);color:var(--fg);
  border:1px solid var(--bd);border-radius:16px;padding:12px 16px;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  box-shadow:var(--sh);z-index:10;
}

#hud{
  top:calc(env(safe-area-inset-top,0px) + 10px);right:10px;
  display:none;font-size:14px;line-height:1.65;min-width:175px;
}
#hud .stat{display:flex;justify-content:space-between;gap:12px;font-weight:700}
#hud .money{color:#16a34a;font-size:16px}
#hud .time{font-size:12px;opacity:.75;border-top:1px solid var(--bd);margin-top:4px;padding-top:4px;display:flex;justify-content:space-between}

#topBtns{
  top:calc(env(safe-area-inset-top,0px) + 10px);left:10px;
  display:none;gap:6px;position:fixed;z-index:12;
}
#topBtns button{padding:8px 12px;font-size:14px;border-radius:12px;box-shadow:var(--sh)}

#hint{
  bottom:calc(env(safe-area-inset-bottom,0px) + 14px);left:50%;transform:translateX(-50%);
  display:none;font-size:14px;font-weight:700;white-space:nowrap;z-index:11;
  background:rgba(15,23,42,.88);color:#fff;border-color:rgba(255,255,255,.2);
}

#dlg{bottom:70px;left:50%;transform:translateX(-50%);width:min(440px,92vw);display:none;z-index:15}
#dlg b{color:var(--ac)}

#cr,#sp{
  top:50%;left:50%;transform:translate(-50%,-50%);
  width:min(400px,92vw);display:none;max-height:82vh;overflow:auto;z-index:20;
}
#cr{top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);transform:translateX(-50%)}

button{
  font:inherit;font-weight:700;background:var(--ac);color:#fff;border:0;
  border-radius:10px;padding:8px 14px;margin:3px;cursor:pointer;
  transition:transform .1s,opacity .15s;
}
button:active{transform:scale(.95)}
button:disabled{opacity:.4;cursor:not-allowed}
button.o{background:var(--pn);color:var(--fg);border:1px solid var(--bd)}
button.g{background:var(--ac2)}
button.s{outline:3px solid var(--fg)}

.sw{display:inline-block;width:28px;height:28px;border-radius:50%;margin:3px;border:2px solid var(--bd);cursor:pointer;vertical-align:middle}
.sw.s{outline:3px solid var(--ac);transform:scale(1.1)}
input[type="text"],#nm{
  font:inherit;padding:8px 10px;border-radius:10px;border:1px solid var(--bd);
  background:rgba(128,128,128,.1);color:var(--fg);width:100%;margin:6px 0;user-select:text;
}
.row{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--bd);padding:8px 0;gap:8px}

#toast{
  top:calc(env(safe-area-inset-top,0px) + 64px);left:50%;transform:translateX(-50%);
  display:none;font-weight:700;z-index:25;background:rgba(15,23,42,.92);color:#fff;
  border-color:var(--ac);text-align:center;max-width:90vw;
}

#st{
  position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
  padding-bottom:calc(env(safe-area-inset-bottom,0px) + 8vh);
  background:linear-gradient(transparent 20%,rgba(0,0,0,.78));color:#fff;text-align:center;
  transition:opacity .8s;z-index:30;
}
#st h1{font-size:clamp(42px,10vw,88px);margin:0;text-shadow:0 6px 30px rgba(0,0,0,.8);letter-spacing:1px}
#st p{margin:6px 0 20px;font-size:clamp(15px,4vw,19px);text-shadow:0 2px 10px #000;opacity:.92}
#st .big{font-size:22px;padding:13px 54px;border-radius:40px;box-shadow:0 10px 25px rgba(232,115,12,.45)}
#set{display:none;margin-top:12px;color:var(--fg);text-align:right;line-height:2.1;min-width:220px}

#gps{
  left:10px;top:calc(env(safe-area-inset-top,0px) + 56px);
  display:none;padding:6px;border-radius:14px;z-index:11;
}
#mp{border-radius:10px;display:block;width:136px;height:136px;transition:width .2s,height .2s}
#gps.big #mp{width:230px;height:230px}
#gps .gbtns{display:flex;justify-content:space-between;margin-top:4px}
#gps .gbtns button{padding:3px 9px;font-size:13px;margin:0}

/* أدوات التحكم باللمس للجوال */
#mobileUI{position:fixed;inset:0;pointer-events:none;z-index:14;display:none}
#joyZone{
  position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);right:22px;
  width:136px;height:136px;border-radius:50%;
  background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.32);
  backdrop-filter:blur(4px);pointer-events:auto;touch-action:none;
}
#joyKnob{
  position:absolute;top:50%;left:50%;width:54px;height:54px;margin:-27px 0 0 -27px;
  border-radius:50%;background:radial-gradient(circle at 30% 30%,#ff9f43,#e8730c);
  border:2px solid #fff;box-shadow:0 4px 14px rgba(0,0,0,.4);
  transition:transform .04s linear;
}
#actZone{
  position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);left:20px;
  display:flex;flex-direction:column;gap:10px;align-items:flex-start;pointer-events:auto;
}
.mBtn{
  width:62px;height:62px;border-radius:50%;font-size:13px;font-weight:800;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:rgba(20,25,35,.78);color:#fff;border:2px solid rgba(255,255,255,.35);
  box-shadow:0 6px 18px rgba(0,0,0,.35);padding:0;margin:0;line-height:1.1;
}
.mBtn.primary{width:74px;height:74px;background:linear-gradient(135deg,#e8730c,#d35400);border-color:#fff;font-size:14px}
.mBtn.green{background:linear-gradient(135deg,#16a34a,#15803d)}
.mRow{display:flex;gap:10px;align-items:center}

@media (max-width:600px){
  #hud{font-size:12.5px;padding:8px 11px;min-width:148px}
  #mp{width:112px;height:112px}
  #gps.big #mp{width:190px;height:190px}
  #hint{bottom:calc(env(safe-area-inset-bottom,0px) + 172px);font-size:12px;padding:6px 12px}
}
</style>
</head>
<body>
<div id="hud" class="pn"></div>
<div id="topBtns">
  <button class="o" id="btnShop">🏪 المتجر</button>
  <button class="o" id="btnCam">🎥 الكاميرا</button>
  <button class="o" id="btnPause">⚙</button>
</div>
<div id="hint" class="pn"></div>
<div id="toast" class="pn"></div>
<div id="dlg" class="pn"></div>

<div id="st">
  <h1>عالم الفلافل</h1>
  <p>ابنِ إمبراطورية الفلافل ووصّل الطلبات في قلب المدينة</p>
  <button class="big" id="play">▶ العب الآن</button>
  <button class="o" id="setb" style="color:#fff;border-color:rgba(255,255,255,.5);background:rgba(0,0,0,.4)">⚙ الإعدادات</button>
  <div id="set" class="pn">
    <label><input type="checkbox" id="o_sh" checked> الظلال الواقعية</label><br>
    <label><input type="checkbox" id="o_hd" checked> دقة عالية (HD)</label><br>
    <label><input type="checkbox" id="o_mu" checked> الصوت والموسيقى</label><br>
    <label><input type="checkbox" id="o_rn"> أجواء ممطرة</label><br>
    <label><input type="checkbox" id="o_mb"> إظهار أزرار الجوال دائماً</label>
  </div>
</div>

<div id="gps" class="pn">
  <canvas id="mp" width="220" height="220"></canvas>
  <div class="gbtns">
    <button class="o" id="zi">+</button>
    <button class="o" id="zo">−</button>
    <button class="o" id="zb">⛶</button>
  </div>
</div>

<div id="mobileUI">
  <div id="actZone">
    <div class="mRow">
      <button class="mBtn" id="mRide">🚶<br>نزول</button>
      <button class="mBtn" id="mHorn">📯<br>بوري</button>
    </div>
    <button class="mBtn primary" id="mAct">📦<br>تفاعل</button>
  </div>
  <div id="joyZone"><div id="joyKnob"></div></div>
</div>

<div id="cr" class="pn">
  <b>صمّم شخصيتك</b>
  <input id="nm" type="text" placeholder="اسم اللاعب" maxlength="14" value="أبو فلافل">
  <div style="margin:4px 0">البشرة: <span id="c0"></span></div>
  <div style="margin:4px 0">القميص: <span id="c1"></span></div>
  <div style="margin:4px 0">القبعة: <span id="c2"></span></div>
  <div style="margin:4px 0">المظهر: <span id="c3"></span></div>
  <button id="go" style="width:100%;margin-top:8px;padding:10px">ابدأ اللعب 🚀</button>
</div>

<div id="sp" class="pn"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ---------- طبقة البيانات ----------
const DB={
  load(){try{return JSON.parse(localStorage.getItem('falafel_save_v2'))}catch(e){return null}},
  save(s){try{localStorage.setItem('falafel_save_v2',JSON.stringify(s))}catch(e){}}
};
const SKINS=['#f1c9a0','#d9a273','#a8744a','#6b4630'];
const SHIRTS=['#c0392b','#2980b9','#27ae60','#8e44ad','#f39c12','#2c3e50'];
const HATS=['بدون','كاب','طباخ'];
const STY=['قصير','طويل','غترة','لحية'];
const VEH=[
  {n:'سيكل',sp:11,acc:18,pr:0},
  {n:'سكوتر',sp:17,acc:24,pr:300},
  {n:'دباب',sp:24,acc:32,pr:900},
  {n:'سيارة',sp:34,acc:40,pr:2500},
  {n:'طيارة',sp:52,acc:48,pr:8000}
];
const SHOPC=[150,400,900,2000,4500,9000];
const BRANCH=[[3,2],[-3,3],[2,-3],[-4,-2]];
let S=Object.assign({name:'أبو فلافل',skin:0,shirt:0,hat:0,st:0,money:100,veh:0,cur:0,shop:0,br:0,del:0,tut:0},DB.load()||{});
const \$=id=>document.getElementById(id);
const P=52;
const isMobile=('ontouchstart' in window)||navigator.maxTouchPoints>0||innerWidth<820;

// ---------- إعداد المشهد والكاميرا ----------
const sc=new THREE.Scene();
sc.background=new THREE.Color(0x9fd3f2);
sc.fog=new THREE.FogExp2(0x9fd3f2,.0034);

const cam=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.1,550);
const rd=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
rd.domElement.id='c3d';
rd.setSize(innerWidth,innerHeight);
rd.setPixelRatio(Math.min(devicePixelRatio,2));
rd.shadowMap.enabled=true;
rd.shadowMap.type=THREE.PCFSoftShadowMap;
rd.toneMapping=THREE.ACESFilmicToneMapping;
rd.toneMappingExposure=1.22;
document.body.prepend(rd.domElement);

const hemi=new THREE.HemisphereLight(0xffffff,0x556655,.85);
sc.add(hemi);
const sun=new THREE.DirectionalLight(0xffffff,.75);
sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.bias=-0.0005;
const sx=sun.shadow.camera;
sx.left=sx.bottom=-80;sx.right=sx.top=80;sx.far=320;
sc.add(sun,sun.target);

addEventListener('resize',()=>{
  cam.aspect=innerWidth/innerHeight;
  cam.updateProjectionMatrix();
  rd.setSize(innerWidth,innerHeight);
});

const M=c=>new THREE.MeshStandardMaterial({color:c,roughness:.75});
const box=(w,h,d,c)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),M(c));m.castShadow=m.receiveShadow=true;return m};

// ---------- أدوات الرسم والـ Textures ----------
const cv=(w,h,f)=>{const c=document.createElement('canvas');c.width=w;c.height=h;f(c.getContext('2d'));return c};
const ctex=(c,rx,ry)=>{const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rx,ry);t.anisotropy=4;return t};
function textTex(t,bg){
  return new THREE.CanvasTexture(cv(256,64,x=>{
    x.fillStyle=bg;x.fillRect(0,0,256,64);
    x.strokeStyle='rgba(255,255,255,.35)';x.lineWidth=4;x.strokeRect(4,4,248,56);
    x.fillStyle='#fff';x.font='bold 36px Tajawal,Tahoma,sans-serif';
    x.textAlign='center';x.textBaseline='middle';x.direction='rtl';
    x.fillText(t,128,34);
  }));
}

// ---------- الأرضية والطرق والأرصفة ----------
const asphM=new THREE.MeshStandardMaterial({
  map:ctex(cv(128,128,x=>{
    x.fillStyle='#34383e';x.fillRect(0,0,128,128);
    for(let i=0;i<1800;i++){
      const g=36+Math.random()*46|0;
      x.fillStyle=`rgba(${g},${g},${g},.5)`;
      x.fillRect(Math.random()*128,Math.random()*128,1.6,1.6);
    }
  }),120,120),
  roughness:.88,metalness:.05
});
const ground=new THREE.Mesh(new THREE.PlaneGeometry(950,950),asphM);
ground.receiveShadow=true;ground.rotation.x=-Math.PI/2;
sc.add(ground);

const pavM=new THREE.MeshStandardMaterial({
  map:ctex(cv(64,64,x=>{
    x.fillStyle='#c4bfb3';x.fillRect(0,0,64,64);
    x.strokeStyle='#969084';x.lineWidth=2;
    x.strokeRect(0,0,32,32);x.strokeRect(32,32,32,32);
  }),8,8),
  roughness:.85
});

// خطوط الشوارع وممرات المشاة
{
  const x0=cv(8,64,x=>{x.fillStyle='#f5d142';x.fillRect(2,0,4,30)});
  const t=ctex(x0,1,65);
  const m=new THREE.MeshBasicMaterial({map:t,transparent:true});
  for(let k=-5;k<=5;k++)for(const r of[0,1]){
    const p=new THREE.Mesh(new THREE.PlaneGeometry(.45,520),m);
    p.rotation.x=-Math.PI/2;p.rotation.z=r?Math.PI/2:0;
    p.position.set(r?0:k*P+26,.03,r?k*P+26:0);
    sc.add(p);
  }
  const zt=ctex(cv(64,16,x=>{x.fillStyle='#eee';for(let i=0;i<4;i++)x.fillRect(i*16+2,0,9,16)}),2,1);
  const im=new THREE.InstancedMesh(new THREE.PlaneGeometry(12,3.4),new THREE.MeshBasicMaterial({map:zt,transparent:true,opacity:.88,depthWrite:false}),400);
  const m4=new THREE.Matrix4(),q=new THREE.Quaternion(),eu=new THREE.Euler(),sv=new THREE.Vector3(1,1,1);
  let n=0;
  for(let i=-5;i<=4;i++)for(let j=-5;j<=4;j++)for(const [ox,oz,r] of[[0,9,0],[0,-9,0],[9,0,1],[-9,0,1]]){
    q.setFromEuler(eu.set(-Math.PI/2,r?Math.PI/2:0,0,'YXZ'));
    m4.compose(new THREE.Vector3(i*P+26+ox,.04,j*P+26+oz),q,sv);
    im.setMatrixAt(n++,m4);
  }
  sc.add(im);
}

// ---------- السماء، النجوم، السحب، والمطر ----------
const skyU={top:{value:new THREE.Color()},hor:{value:new THREE.Color()},sunD:{value:new THREE.Vector3(0,1,0)},sunC:{value:new THREE.Color()}};
const skyM=new THREE.ShaderMaterial({
  uniforms:skyU,side:THREE.BackSide,depthWrite:false,
  vertexShader:'varying vec3 v;void main(){v=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
  fragmentShader:'varying vec3 v;uniform vec3 top,hor,sunD,sunC;void main(){float h=clamp(v.y,0.,1.);vec3 c=mix(hor,top,pow(h,.55));float s=max(dot(v,normalize(sunD)),0.);c+=sunC*(pow(s,500.)*3.+pow(s,8.)*.4);gl_FragColor=vec4(c,1.);}'
});
const dome=new THREE.Mesh(new THREE.SphereGeometry(480,24,16),skyM);
dome.renderOrder=-10;dome.frustumCulled=false;sc.add(dome);
const pmg=new THREE.PMREMGenerator(rd),envScene=new THREE.Scene();
envScene.add(new THREE.Mesh(dome.geometry,skyM));

const starP=new Float32Array(1200);
for(let i=0;i<400;i++){
  const a=Math.random()*6.28,e=.15+Math.random()*1.2;
  starP[i*3]=Math.cos(a)*Math.cos(e)*440;
  starP[i*3+1]=Math.sin(e)*440;
  starP[i*3+2]=Math.sin(a)*Math.cos(e)*440;
}
const stG=new THREE.BufferGeometry();stG.setAttribute('position',new THREE.BufferAttribute(starP,3));
const stars=new THREE.Points(stG,new THREE.PointsMaterial({color:0xffffff,size:1.7,transparent:true,opacity:0,fog:false}));
sc.add(stars);

const cloudMat=new THREE.MeshLambertMaterial({color:0xffffff,transparent:true,opacity:.85});
const clouds=[];
for(let i=0;i<18;i++){
  const cg=new THREE.Group();
  for(let k=0;k<4;k++){
    const puff=new THREE.Mesh(new THREE.DodecahedronGeometry(4+Math.random()*4,1),cloudMat);
    puff.position.set((k-1.5)*4,Math.random()*2,(Math.random()-.5)*4);
    puff.scale.y=.55;cg.add(puff);
  }
  cg.position.set((Math.random()-.5)*600,65+Math.random()*25,(Math.random()-.5)*600);
  clouds.push(cg);sc.add(cg);
}
