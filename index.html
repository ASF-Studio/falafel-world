<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>مواعيد عالم الفلافل</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #f59e0b;
      --accent-soft: rgba(245, 158, 11, 0.14);
      --border: rgba(255, 255, 255, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Tahoma, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .schedule-box {
      width: 100%;
      max-width: 540px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
    }

    .schedule-title {
      font-size: 1.5rem;
      font-weight: 800;
      margin-bottom: 6px;
      color: var(--accent);
    }

    .schedule-subtitle {
      font-size: 0.95rem;
      color: var(--muted);
      margin-bottom: 22px;
    }

    .events-list {
      display: grid;
      gap: 14px;
    }

    .event-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(15, 23, 42, 0.55);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px 18px;
    }

    .event-name {
      font-size: 1.05rem;
      font-weight: 700;
    }

    .event-date {
      background: var(--accent-soft);
      color: var(--accent);
      border: 1px solid rgba(245, 158, 11, 0.3);
      padding: 6px 14px;
      border-radius: 999px;
      font-weight: 800;
      font-size: 0.95rem;
      direction: ltr;
    }
  </style>
</head>
<body>
  <section class="schedule-box" aria-label="مواعيد عالم الفلافل">
    <h1 class="schedule-title">عالم الفلافل — المواعيد الرسمية</h1>
    <p class="schedule-subtitle">تابع أهم المحطات القادمة للعبة</p>

    <div class="events-list">
      <div class="event-item">
        <span class="event-name">التريلر</span>
        <span class="event-date">11/23</span>
      </div>

      <div class="event-item">
        <span class="event-name">موعد النزول</span>
        <span class="event-date">11/24</span>
      </div>

      <div class="event-item">
        <span class="event-name">مود القصة باللعبة</span>
        <span class="event-date">11/25</span>
      </div>
    </div>
  </section>
</body>
</html>
