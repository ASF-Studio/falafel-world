 else if(i==5){t='<div class=row><button data-s=mu>'+(musicOn?'🔊 الصوت: يعمل':'🔇 الصوت: مكتوم')+'</button></div><div class=row><button data-s=sh>'+(rd.shadowMap.enabled?'الظلال: تعمل':'الظلال: متوقفة')+'</button></div><div class=row><button data-s=rn>'+(rainOn?'المطر: يعمل':'المطر: متوقف')+'</button></div>'}
 return t}
function renderPh(){const tm=String(Math.floor(hrs)).padStart(2,'0')+':'+String(Math.floor(hrs%1*60)).padStart(2,'0');
 let t='<div style="position:absolute;top:16px;left:50%;transform:translateX(-50%);width:90px;height:22px;background:#000;border-radius:12px;z-index:2"></div><div style="height:100%;border-radius:32px;overflow:auto;background:linear-gradient(160deg,#1b2a52,#4a2a6a 55%,#d4612a);padding:48px 14px 14px;position:relative"><div style="position:absolute;top:14px;left:22px;right:22px;display:flex;justify-content:space-between;font-size:11px"><span>'+tm+'</span><span>📶 🔋 '+Math.max(20,100-S.del%80)+'%</span></div>';
 if(phApp<0)t+='<div style="text-align:center;font-size:34px;margin:4px 0 16px">'+tm+'</div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px 6px">'+APPS.map((a,i)=>'<div data-a='+i+' style="text-align:center;cursor:pointer"><div style="width:58px;height:58px;margin:auto;border-radius:16px;background:'+a[2]+';display:flex;align-items:center;justify-content:center;font-size:28px;box-shadow:0 4px 10px rgba(0,0,0,.4)">'+a[0]+'</div><small>'+a[1]+'</small></div>').join('')+'</div><div style="position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:80px;height:4px;background:#fff8;border-radius:2px;cursor:pointer" data-x=1></div>';
 else t+='<button class=o data-b=1>◀</button> <b>'+APPS[phApp][1]+'</b>'+appBody(phApp);
 phEl.innerHTML=t+'</div>'}
phEl.onclick=e=>{const a=e.target.closest('[data-a]');if(a){phApp=+a.dataset.a;phTab=phApp;if(phApp==4){togglePh();$('zb').onclick();return}renderPh();return}const b=e.target.closest('button,[data-x]');if(!b)return;const d=b.dataset;
 if(d.x){togglePh();return}if(d.b){phApp=-1;phTab=-1;renderPh();return}if(d.h){hire(d.h);return}if(d.f){fire(d.f);return}
 if(d.s){if(d.s=='mu'){musicOn=!musicOn;if(master)master.gain.value=musicOn?.6:0}else if(d.s=='sh'){rd.shadowMap.enabled=!rd.shadowMap.enabled;sc.traverse(o=>{if(o.material)o.material.needsUpdate=true})}else if(d.s=='rn'){rainOn=!rainOn;rainM.visible=rainOn;sc.fog.near=rainOn?20:80;sc.fog.far=rainOn?190:330}renderPh();return}
 if(d.o){const a2=d.o.split(':'),o=ORD.find(x=>x.id==+a2[1]);if(!o)return;if(a2[0]=='prep'){if(!near(243,-8,6))return toast('اذهب للكشك أولاً');if(!onFoot)return toast('انزل من المركبة (F)');if(cooking)return;o.st=1;o.isOrder=1;startCook(o);togglePh()}else if(a2[0]=='self')selfDel(o);else if(a2[0]=='cour'){courDel(o);renderPh()}}};

let last=performance.now(),orb=0;
function loop(t){
 requestAnimationFrame(loop);const dt=Math.min(.05,(t-last)/1000);last=t;
 npcs.forEach(g=>{if(1){npcStep(g,dt);return}const u=g.userData;u.t+=u.dir*1.6*dt;if(Math.abs(u.t)>230)u.dir*=-1;const [x,z]=npcPos(g);g.position.set(x,0,z);g.rotation.y=u.ax?(u.dir>0?0:Math.PI):(u.dir>0?Math.PI/2:-Math.PI/2)});
 beacon.rotation.y+=dt;if(hub)tod=.455;if(sbFreeze)tod=sbT;cars.forEach(g=>carStep(g,dt));daycycle(dt);fx(dt);rainStep(dt);wx(dt);lineStep(dt);nightLights(dt);shopTick(dt);phoneTick(dt);staffTick(dt);
 if(playing)step(dt);
 else if(ldCam(dt)){}else if(menuCam(dt)){}else{if(!drag)orb+=dt*.5;const p=player.position;cam.position.set(p.x+Math.sin(orb)*4.5,2.1,p.z+Math.cos(orb)*4.5);cam.lookAt(p.x,1.1,p.z)}
 rd.render(sc,cam);
}
requestAnimationFrame(loop);
