 h+='<div class="row"><span>🏬 فتح فرع جديد ('+S.br+'/4)<br><small>دخل تلقائي كل 10 ثوانٍ</small></span>'+(S.br<4?'<button '+(S.money<bc?'disabled':'')+' onclick="buy(\'br\')">'+bc+'</button>':'<span>مكتمل</span>')+'</div>';
 VEH.forEach((x,i)=>{
  let b=i<=S.veh?'<button class="'+(S.cur==i?'':'o')+'" onclick="S.cur='+i+';buildVeh('+i+');renderPanel()">'+(S.cur==i?'مستخدمة':'استخدم ('+(i+1)+')')+'</button>':(i==S.veh+1?'<button '+(S.money<x.pr?'disabled':'')+' onclick="buy(\'veh\')">'+x.pr+'</button>':'<span>🔒</span>');
  h+='<div class="row"><span>'+['🚲','🛴','🏍️','🚗','✈️'][i]+' '+x.n+' <small>(سرعة '+x.sp+')</small></span>'+b+'</div>';
 });
 $('sp').innerHTML=h;
}
function buy(w){sfx('buy');
 if(w=='shop'&&S.money>=SHOPC[S.shop]){S.money-=SHOPC[S.shop];S.shop++;updateShop();burst(0,10,0,0x66ffcc,40,14,10,1.2)}
 else if(w=='br'&&S.money>=3000*(S.br+1)&&S.br<4){S.money-=3000*(S.br+1);S.br++;showBranches();toast('تم فتح فرع جديد!');burst(BRANCH[S.br-1][0]*P,10,BRANCH[S.br-1][1]*P,0xffd400,40,14,10,1.5)}
 else if(w=='veh'&&S.money>=VEH[S.veh+1].pr){S.money-=VEH[S.veh+1].pr;S.veh++;S.cur=S.veh;buildVeh(S.cur);burst(player.position.x,2,player.position.z,0x66aaff,30,10,8,1)}
 save();renderPanel();
}

// ---------- شاشة تصميم الشخصية ----------
function swatches(id,arr,key,fn){
 const el=$(id);el.innerHTML='';arr.forEach((c,i)=>{
  const s=document.createElement(fn?'button':'span');
  if(fn){s.textContent=c;s.className='o'+(S[key]==i?' s':'')}else{s.className='sw'+(S[key]==i?' s':'');s.style.background=c}
  s.onclick=()=>{S[key]=i;buildRider();swatches('c0',SKINS,'skin');swatches('c1',SHIRTS,'shirt');swatches('c2',HATS,'hat',1);swatches('c3',STY,'st',1)};
  el.appendChild(s)})
}
swatches('c0',SKINS,'skin');swatches('c1',SHIRTS,'shirt');swatches('c2',HATS,'hat',1);
swatches('c3',STY,'st',1);$('nm').value=S.name;
$('go').onclick=()=>{S.name=$('nm').value.trim()||'لاعب';initAudio();$('cr').style.display='none';$('hud').style.display='block';$('gps').style.display='block';playing=true;
 if(S.tut>=TUT.length+1)seo.visible=false;showBranches();save()};
buildRider();buildVeh(S.cur);showBranches();
// ---------- الحلقة ----------
let last=performance.now(),orb=0;
function loop(t){
 requestAnimationFrame(loop);const dt=Math.min(.05,(t-last)/1000);last=t;
 npcs.forEach(g=>{if(1){npcStep(g,dt);return}const u=g.userData;u.t+=u.dir*1.6*dt;if(Math.abs(u.t)>230)u.dir*=-1;const [x,z]=npcPos(g);g.position.set(x,0,z);g.rotation.y=u.ax?(u.dir>0?0:Math.PI):(u.dir>0?Math.PI/2:-Math.PI/2)});
 beacon.rotation.y+=dt;cars.forEach(g=>carStep(g,dt));daycycle(dt);fx(dt);rainStep(dt);wx(dt);
 if(playing)step(dt);
 else if(menuCam(dt)){}else{orb+=dt*.5;const p=player.position;cam.position.set(p.x+Math.sin(orb)*6,3,p.z+Math.cos(orb)*6);cam.lookAt(p.x,2.2,p.z)}
 rd.render(sc,cam);
}
requestAnimationFrame(loop);
</script>
